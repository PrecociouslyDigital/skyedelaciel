# Builds the Tumblr theme from the site, offers it as an artifact, and puts it
# on the blog if the blog is wearing an older one. Tumblr has no API for
# themes, so the upload drives Tumblr's editor in Chrome, with the session in
# the TUMBLR_SESSION secret, or failing that logging in with the other
# TUMBLR_* secrets; see tools/tumblr-browser.mjs. If a run goes red, the fix
# is `npm run tumblr:upload` from an attended machine, and a re-run.
name: Tumblr theme

on:
    push:
        branches: [release]
    workflow_dispatch:

# One upload at a time, so two pushes cannot race to save the theme.
concurrency:
    group: tumblr-theme

jobs:
    theme:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: tumblr-theme
                  path: dist-tumblr/theme.html
            # The runner's own Chrome, shown on a virtual display rather than
            # headless, as if at a desk: Tumblr turns away a login from a
            # browser that looks automated. The upload checks the live stamp
            # itself, so a theme that does not take still fails the run.
            - run: npx playwright install-deps chromium
            - name: Upload the theme if the blog's is older
              run: npm run tumblr:check || xvfb-run --auto-servernum npm run tumblr:upload
              env:
                  TUMBLR_EMAIL: ${{ secrets.TUMBLR_EMAIL }}
                  TUMBLR_PASSWORD: ${{ secrets.TUMBLR_PASSWORD }}
                  TUMBLR_TOTP: ${{ secrets.TUMBLR_TOTP }}
                  TUMBLR_SESSION: ${{ secrets.TUMBLR_SESSION }}
            # What Tumblr was showing when the upload gave up, its fields
            # blanked. Kept briefly: the repository's artifacts are public.
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: tumblr-failure
                  path: dist-tumblr/failure.png
                  if-no-files-found: ignore
                  retention-days: 3
